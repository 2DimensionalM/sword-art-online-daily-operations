name: Bug report
description: Report a reproducible problem with local operation.
body:
  - type: markdown
    attributes:
      value: |
        Use fictional task data when reproducing a problem. Do not attach your database, backups, recovery exports, or private screenshots. For vulnerabilities, see SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using fictional tasks.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js version, and commit or branch.
      placeholder: macOS / Chrome / Node.js 22.13 / main
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove personal content and local usernames or paths before sharing.
